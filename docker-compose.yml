name: smartcs

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data/seed:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage

  api:
    build: ./api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      N8N_BASE_URL: http://n8n:5678
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: ${N8N_HOST}
      WEBHOOK_URL: ${WEBHOOK_URL}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE}
      TZ: ${GENERIC_TIMEZONE}
      SMARTCS_API_URL: http://api:8000
      SMARTCS_INTERNAL_KEY: ${INTERNAL_API_KEY}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_RUNNERS_ENABLED: "true"
      N8N_PROXY_HOPS: "1"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      # Optional: trust a TLS-inspecting proxy/antivirus root CA (put it at certs/extra-ca.pem).
      NODE_EXTRA_CA_CERTS: /certs/extra-ca.pem
    ports:
      # Host port 5679 so it can run alongside a locally installed n8n on 5678.
      - "127.0.0.1:5679:5678"
    volumes:
      - n8ndata:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
      - ./certs:/certs:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Dev only: public HTTPS URL for Telegram webhooks (Cloudflare Quick Tunnel, URL changes on restart).
  # Run scripts/tunnel_url.ps1 to sync WEBHOOK_URL. Production uses Caddy + a real domain instead.
  # The tunnel goes through webhook-gw so only /webhook/* is public, never the n8n editor.
  webhook-gw:
    image: caddy:2-alpine
    restart: unless-stopped
    volumes:
      - ./deploy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
    profiles: ["dev"]
    depends_on:
      - n8n

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://webhook-gw:80
    profiles: ["dev"]
    depends_on:
      - webhook-gw

volumes:
  pgdata:
  redisdata:
  qdrantdata:
  n8ndata:
