[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE"]
# B008: FastAPI's Depends()/Header() in defaults is the intended idiom.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Eval scripts hold long Vietnamese judge prompts and report templates.
"evals/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
